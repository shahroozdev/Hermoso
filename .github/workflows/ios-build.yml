name: iOS Build

# Compiles the Hermoso iOS app on a macOS runner — this is the verification
# step the app has never been through, since it was written on Windows
# (no local Xcode/Swift toolchain available there). Runs on every push/PR
# that touches ios/, and can be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Pinned rather than macos-latest: macos-15 ships Xcode 16.0–16.4 (default
    # 16.4), which matches this project's IPHONEOS_DEPLOYMENT_TARGET of 16.0.
    # macos-latest moved to macos-26 in mid-2026 — bump this once that image's
    # Xcode/Swift version has been verified against this project.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      # Unsigned simulator build — no code signing certs exist in CI, and
      # none are needed just to verify the app compiles.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Hermoso.xcodeproj \
            -scheme Hermoso \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
