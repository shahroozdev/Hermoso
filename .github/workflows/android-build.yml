name: Android Build

# Compiles both split Android apps (android-customer "Hermoso App" and
# android-owner "Hermoso Business") on ubuntu-latest. Android builds do work
# locally on Windows via Gradle, unlike the iOS toolchain, but CI still
# catches issues from a clean environment and matches the iOS verification
# workflow's structure — see docs/APP_SPLIT_PLAN.md.
on:
  push:
    branches: [main]
    paths:
      - "android-customer/**"
      - "android-owner/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-customer/**"
      - "android-owner/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [android-customer, android-owner]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 9.x / AGP 9.x require JDK 17+; 21 is used here since it's the
      # current LTS and what these toolchain versions target.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ matrix.dir }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
